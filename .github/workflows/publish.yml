name: Append and publish

# Keeps https://dashboard.idzharulhuda.com current: harvests new earthquakes, rebuilds the page,
# runs both acceptance gates, and pushes only if everything passed.
#
# There is no secret anywhere in this workflow. USGS and BMKG are public, and the push uses the
# GITHUB_TOKEN that Actions provides for the run, scoped to this repository.
#
# The pipeline itself is NOT reimplemented here. It calls pipeline/publish.sh, the same script the
# machine cron calls, so "what the gates are" has exactly one definition and the two runners cannot
# drift apart.

on:
  schedule:
    # 23:30 UTC is 06:30 WIB, early enough that a new earthquake is usually on the page before the
    # day starts. GitHub's cron is UTC and can lag a few minutes under load; the exact minute is
    # not important, the daily cadence is.
    - cron: "30 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two publishers run at once. If one is still going when the next fires, queue it rather
# than cancelling: a half-finished harvest is worse than a late one.
concurrency:
  group: publish-earthquake-story
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # publish.sh rebases onto origin/main before pushing, which needs the history.
          fetch-depth: 0
          # Leave the token in the local git config so the script's own push is authenticated.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the probe, because the browser build only needs to change when we upgrade it.
          key: playwright-${{ runner.os }}-${{ hashFiles('pipeline/probe_browser.py') }}

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Configure the commit identity
        # Without this the commits land under a generic bot identity and drop off the
        # contribution graph entirely.
        run: |
          git config user.name "idzharulhuda13"
          git config user.email "idzharul.huda@gmail.com"

      - name: Harvest, build, gate, publish
        env:
          # publish.sh looks for an interpreter that can import playwright. Say which one
          # explicitly here rather than letting it guess.
          PYTHON: python3
        run: bash pipeline/publish.sh

      - name: Show the publish log on failure
        if: failure()
        run: |
          echo "--- data/out/publish.log ---"
          tail -40 data/out/publish.log 2>/dev/null || echo "(no log written)"
